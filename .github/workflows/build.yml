name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Read application version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content -LiteralPath Directory.Build.props -Raw)).Project.PropertyGroup.Version
          "TRACKER_VERSION=$version" >> $env:GITHUB_ENV
      - name: Restore
        run: dotnet restore CodexTracker.slnx
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $parseTokens = $null; $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Build
        run: dotnet build CodexTracker.slnx -c Release --no-restore
      - name: Test release signature guards
        shell: pwsh
        run: ./scripts/test-release-signing.ps1
      - name: Test WinGet manifest preparation
        shell: pwsh
        run: ./scripts/test-winget.ps1
      - name: Test
        run: dotnet test tests/CodexTracker.Tests/CodexTracker.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Test WPF activation and account features
        # Real WPF windows and fictional accounts: activation, avatars, privacy, refresh, ICS export.
        # Run from the repository root so the smoke harness can read application resources.
        shell: pwsh
        run: dotnet run --project tests/CodexTracker.UiSmoke/CodexTracker.UiSmoke.csproj -c Release --no-build
      - name: Publish portable Windows app
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Build per-user Windows installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -InstallCompiler
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test published executable MCP protocol with fictional data
        shell: pwsh
        run: python scripts/test-mcp.py "artifacts/publish/$env:TRACKER_VERSION/CodexTracker.exe"
      - name: Test real MCP startup deadline
        shell: pwsh
        run: ./scripts/test-mcp-startup.ps1 -ExecutablePath "artifacts/publish/$env:TRACKER_VERSION/CodexTracker.exe"
      - name: Test installer lifecycle in the dedicated runner profile
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Run -DedicatedTestProfile -SetupPath "artifacts/CodexTracker-$env:TRACKER_VERSION-Setup.exe" -ExpectedVersion $env:TRACKER_VERSION -ReportPath artifacts/installer-lifecycle.json
      - uses: actions/upload-artifact@v7
        with:
          name: CodexTracker-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/*-Setup.exe
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: installer-lifecycle-results
          path: artifacts/installer-lifecycle.json
