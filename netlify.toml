# Public site https://codex-tracker.zqsdev.com, rebuilt by Netlify on every push to main.
# Sources in site/, build in scripts/build-site.py; headers and redirects in site/_headers and site/_redirects.
[build]
command = "python3 scripts/build-site.py"
publish = "artifacts/site"
# Skip the build when nothing the site uses changed.
ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site docs/*.png scripts/build-site.py netlify.toml Directory.Build.props src/CodexTracker.App/Assets/Fonts"

[build.environment]
PYTHON_VERSION = "3.12"
